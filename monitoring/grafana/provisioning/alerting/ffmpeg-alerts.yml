apiVersion: 1

groups:
  - name: FFmpeg API Health
    folder: FFmpeg Alerts
    interval: 1m
    rules:
      - title: API Health Check
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job="ffmpeg-api"} == 0
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: B
            datasourceUid: prometheus
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: prometheus
                uid: prometheus
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
          - refId: C
            datasourceUid: prometheus
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: prometheus
                uid: prometheus
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        isPaused: false
        labels:
          severity: critical
        annotations:
          description: "A API FFmpeg está fora do ar ou não está respondendo por mais de 1 minuto."
          summary: "API FFmpeg Health Check Failed" 