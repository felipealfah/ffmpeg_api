apiVersion: 1

notifiers:
  - name: FFmpeg API Alerts
    type: slack
    uid: ffmpeg_api_slack
    org_id: 1
    is_default: true
    send_reminder: true
    frequency: 1h
    disable_resolve_message: false
    settings:
      url: ${SLACK_WEBHOOK_URL}
      recipient: "#ffmpeg-api-alerts"
      uploadImage: true
      mentionChannel: "here"
      mentionUsers: ""
      mentionGroups: ""
      token: ${SLACK_API_TOKEN}
      username: "FFmpeg API Monitor"
      icon_emoji: ":movie_camera:" 