services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  ffmpeg-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Configurações Fixas
      - REDIS_HOST=redis
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
      - TEMP_DIR=/app/storage/temp
      - OUTPUT_DIR=/app/storage/output
      - CLEANUP_INTERVAL_HOURS=1
      - TEMP_FILE_TTL_HOURS=1
      - OUTPUT_FILE_TTL_HOURS=24
      - FFMPEG_MUXING_QUEUE_SIZE=1024
      - FFMPEG_CPU_USED=3

      # Configurações de Ambiente
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=${PORT:-3000}

      # Configurações de FFmpeg e Recursos (otimizado para VPS)
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-2}
      - FFMPEG_PRESET=${FFMPEG_PRESET:-faster}
      - FFMPEG_MAX_MEMORY=${FFMPEG_MAX_MEMORY:-4G}
      - FFMPEG_PRIORITY=${FFMPEG_PRIORITY:-5}
      - FFMPEG_BITRATE=${FFMPEG_BITRATE:-2000k}
      - FFMPEG_AUDIO_BITRATE=${FFMPEG_AUDIO_BITRATE:-128k}
      - FFMPEG_BUFFER_SIZE=${FFMPEG_BUFFER_SIZE:-2000k}
      - FFMPEG_MAX_RATE=${FFMPEG_MAX_RATE:-2500k}

      # Integrações Externas (Secrets)
      - GOOGLE_CLOUD_STORAGE_ENABLED=${GOOGLE_CLOUD_STORAGE_ENABLED:-false}
      - GOOGLE_CLOUD_PROJECT_ID=${GOOGLE_CLOUD_PROJECT_ID}
      - GOOGLE_CLOUD_KEY_FILE=${GOOGLE_CLOUD_KEY_FILE}
      - GOOGLE_CLOUD_BUCKET_NAME=${GOOGLE_CLOUD_BUCKET_NAME}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}

      # Configurações de Custo
      - SERVER_COST_PER_HOUR=${SERVER_COST_PER_HOUR}
      - CLOUD_PROVIDER=${CLOUD_PROVIDER}
      - INSTANCE_TYPE=${INSTANCE_TYPE}
      - COMPLEXITY_FACTOR_LOW=${COMPLEXITY_FACTOR_LOW}
      - COMPLEXITY_FACTOR_MEDIUM=${COMPLEXITY_FACTOR_MEDIUM}
      - COMPLEXITY_FACTOR_HIGH=${COMPLEXITY_FACTOR_HIGH}
      - ADDITIONAL_COST_FACTOR=${ADDITIONAL_COST_FACTOR}

    volumes:
      - ./storage:/app/storage
      - ./src/config:/app/src/config:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    stop_grace_period: 60s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=72h'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.size=2GB'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  internal:
    driver: bridge
    internal: false