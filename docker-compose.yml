services:
  # Serviço Redis para filas - PROTEGIDO
  redis:
    image: redis:7-alpine
    # SEGURANÇA: Redis não exposto externamente
    # ports:
    #   - "6379:6379"  # REMOVIDO POR SEGURANÇA
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-secure_redis_password_2025}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secure_redis_password_2025}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_password_2025}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal

  # Nossa API FFmpeg
  ffmpeg-api:
    # DESENVOLVIMENTO: Build local
    build: .
    
    # PRODUÇÃO: Use imagem pré-construída (descomente linha abaixo)
    # image: ffmpeg-api:latest
    
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secure_redis_password_2025}
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
      - GOOGLE_CLOUD_STORAGE_ENABLED=true
      - GOOGLE_CLOUD_PROJECT_ID=${GOOGLE_CLOUD_PROJECT_ID}
      - GOOGLE_CLOUD_KEY_FILE=${GOOGLE_CLOUD_KEY_FILE}
      - GOOGLE_CLOUD_BUCKET_NAME=${GOOGLE_CLOUD_BUCKET_NAME}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=4096}
      - FFMPEG_MEMORY_LIMIT=${FFMPEG_MAX_MEMORY:-8G}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-5}
      - FFMPEG_PRESET=${FFMPEG_PRESET:-faster}
      - FFMPEG_PRIORITY=${FFMPEG_PRIORITY:-5}
      - FFMPEG_BITRATE=${FFMPEG_BITRATE:-3000k}
      - FFMPEG_AUDIO_BITRATE=${FFMPEG_AUDIO_BITRATE:-128k}
      - FFMPEG_BUFFER_SIZE=${FFMPEG_BUFFER_SIZE:-4000k}
      - FFMPEG_MAX_RATE=${FFMPEG_MAX_RATE:-4000k}
      - FFMPEG_MUXING_QUEUE_SIZE=${FFMPEG_MUXING_QUEUE_SIZE:-1024}
      - FFMPEG_CPU_USED=${FFMPEG_CPU_USED:-3}
      - FFMPEG_NICE=10
    volumes:
      - ./storage:/app/storage
      - ./src/config:/app/src/config
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CONTAINER_CPU_LIMIT:-5.0}'
          memory: '${CONTAINER_MEMORY_LIMIT:-8G}'
        reservations:
          cpus: '${CONTAINER_CPU_RESERVE:-2.0}'
          memory: '${CONTAINER_MEMORY_RESERVE:-2G}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  # Prometheus para coleta de métricas
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  # Grafana para visualização de métricas
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://75.119.156.254:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  # Documentação da API com Mintlify
  docs:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3002:3002"
    volumes:
      - ./docs-site:/app
      - docs-node-modules:/app/node_modules
    command: sh -c "npm install && npx mintlify dev --port 3002 --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - HOST=0.0.0.0
      - NEXT_PUBLIC_HOST=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/introduction"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  docs-node-modules:

networks:
  internal:
    driver: bridge
    internal: false  # Permite acesso externo para serviços que precisam