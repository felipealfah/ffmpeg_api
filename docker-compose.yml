services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal

  ffmpeg-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Ambiente e Credenciais
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FFMPEG_PATH=${FFMPEG_PATH:-/usr/bin/ffmpeg}
      - FFPROBE_PATH=${FFPROBE_PATH:-/usr/bin/ffprobe}
      # Configurações de FFmpeg e Recursos
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-4}
      - FFMPEG_PRESET=${FFMPEG_PRESET:-faster}
      - FFMPEG_MAX_MEMORY=${FFMPEG_MAX_MEMORY:-8G}
      - FFMPEG_PRIORITY=${FFMPEG_PRIORITY:-5}
      - FFMPEG_BITRATE=${FFMPEG_BITRATE:-3000k}
      - FFMPEG_AUDIO_BITRATE=${FFMPEG_AUDIO_BITRATE:-128k}
      - FFMPEG_BUFFER_SIZE=${FFMPEG_BUFFER_SIZE:-4000k}
      - FFMPEG_MAX_RATE=${FFMPEG_MAX_RATE:-4000k}
      - FFMPEG_MUXING_QUEUE_SIZE=${FFMPEG_MUXING_QUEUE_SIZE:-1024}
      - FFMPEG_CPU_USED=${FFMPEG_CPU_USED:-3}
      # Integrações externas
      - GOOGLE_CLOUD_STORAGE_ENABLED=${GOOGLE_CLOUD_STORAGE_ENABLED:-true}
      - GOOGLE_CLOUD_PROJECT_ID=${GOOGLE_CLOUD_PROJECT_ID}
      - GOOGLE_CLOUD_KEY_FILE=${GOOGLE_CLOUD_KEY_FILE}
      - GOOGLE_CLOUD_BUCKET_NAME=${GOOGLE_CLOUD_BUCKET_NAME}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - SERVER_COST_PER_HOUR=${SERVER_COST_PER_HOUR}
      - CLOUD_PROVIDER=${CLOUD_PROVIDER}
      - INSTANCE_TYPE=${INSTANCE_TYPE}
      - COMPLEXITY_FACTOR_LOW=${COMPLEXITY_FACTOR_LOW}
      - COMPLEXITY_FACTOR_MEDIUM=${COMPLEXITY_FACTOR_MEDIUM}
      - COMPLEXITY_FACTOR_HIGH=${COMPLEXITY_FACTOR_HIGH}
      - ADDITIONAL_COST_FACTOR=${ADDITIONAL_COST_FACTOR}
      # Diretórios
      - TEMP_DIR=./storage/temp
      - OUTPUT_DIR=./storage/output
      - CLEANUP_INTERVAL_HOURS=1
      - TEMP_FILE_TTL_HOURS=1
      - OUTPUT_FILE_TTL_HOURS=24
    volumes:
      - ./storage:/app/storage
      - ./src/config:/app/src/config
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '5.0'
          memory: 10G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  docs:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3002:3002"
    volumes:
      - ./docs-site:/app
      - docs-node-modules:/app/node_modules
    command: sh -c "npm install && npx mintlify dev --port 3002 --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - HOST=0.0.0.0
      - NEXT_PUBLIC_HOST=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/introduction"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  docs-node-modules:

networks:
  internal:
    driver: bridge
    internal: false