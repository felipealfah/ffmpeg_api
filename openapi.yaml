openapi: 3.0.0
info:
  title: FFmpeg API
  version: 1.0.0
  description: |
    API para processamento de vídeo usando FFmpeg.
    
    ## Áudio de Fundo (Background Audio)
    
    A API suporta tratamento especial para áudios de fundo, que são processados com volume reduzido
    e podem ser automaticamente repetidos para cobrir a duração total do vídeo.
    
    Existem duas formas de indicar que um áudio é de fundo:
    
    1. **Explicitamente**: Usando a propriedade `isBackground: true` no asset de áudio
    2. **Implicitamente**: Incluindo palavras-chave como 'background', 'bg', 'fundo' ou 'ambient' no nome do arquivo
    
    Exemplo de uso explícito:
    ```json
    {
      "asset": {
        "type": "audio",
        "source": "url",
        "src": "https://example.com/music.mp3",
        "isBackground": true,
        "volume": 0.3  // Opcional: ajuste fino do volume (0.0 a 1.0)
      }
    }
    ```
    
    Características do áudio de fundo:
    - Volume reduzido automaticamente (30% por padrão)
    - Loop automático se menor que a duração do vídeo
    - Transições suaves entre loops
    - Mixagem balanceada com áudios principais

paths:
  /api/render:
    post:
      summary: Inicia um job de renderização
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: Job criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'

components:
  schemas:
    Asset:
      type: object
      required:
        - type
        - source
        - src
      properties:
        type:
          type: string
          enum: [video, audio, image, text, subtitle]
        source:
          type: string
          enum: [url, local]
        src:
          type: string
          description: URL ou caminho local do arquivo
        isBackground:
          type: boolean
          description: |
            (Apenas para áudio) Indica se este é um áudio de fundo.
            Áudios de fundo têm volume reduzido e podem fazer loop automaticamente.
        volume:
          type: number
          minimum: 0
          maximum: 1
          description: |
            (Apenas para áudio) Volume específico para este áudio.
            - Para áudios principais: padrão é 0.8
            - Para áudios de fundo: padrão é 0.3
        style:
          $ref: '#/components/schemas/Style'

    Style:
      type: object
      properties:
        fontSize:
          type: number
        fontColor:
          type: string
        outlineColor:
          type: string
        bold:
          type: boolean
        alignment:
          type: string
          enum: [left, center, right]
        position:
          type: string
          enum: [top, bottom]
        marginV:
          type: number
        outline:
          type: number
        shadow:
          type: number

    Clip:
      type: object
      required:
        - asset
        - start
        - length
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        start:
          type: number
          description: Tempo de início em segundos
        length:
          type: number
          description: Duração em segundos

    Track:
      type: object
      required:
        - clips
      properties:
        clips:
          type: array
          items:
            $ref: '#/components/schemas/Clip'

    Timeline:
      type: object
      required:
        - tracks
      properties:
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'

    RenderOutput:
      type: object
      required:
        - format
      properties:
        format:
          type: string
          enum: [mp4, mov, gif, hls]
        resolution:
          type: string
          example: "1280x720"
        quality:
          type: string
          enum: [low, medium, high]
        fps:
          type: number
        bitrate:
          type: string
          example: "2000k"

    RenderRequest:
      type: object
      required:
        - timeline
        - output
      properties:
        timeline:
          $ref: '#/components/schemas/Timeline'
        output:
          $ref: '#/components/schemas/RenderOutput'
        webhook:
          type: string
          format: uri
          description: URL para notificação quando o processamento for concluído

    JobResponse:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: number
        output:
          type: string
        error:
          type: string 