openapi: 3.0.0
info:
  title: FFmpeg API
  version: 1.0.0
  description: |
    API para processamento de vídeo usando FFmpeg.
    
    ## Exemplos de Uso
    
    ### 1. Repetir o Mesmo Vídeo
    Para repetir o mesmo vídeo múltiplas vezes:
    ```json
    {
      "timeline": {
        "tracks": [
          {
            "clips": [
              {
                "asset": {
                  "type": "video",
                  "source": "url",
                  "src": "https://example.com/video.mp4"
                },
                "start": 0,
                "length": "auto"
              },
              {
                "asset": {
                  "type": "video",
                  "source": "url", 
                  "src": "https://example.com/video.mp4"
                },
                "start": 0,
                "length": "auto"
              }
            ]
          }
        ]
      }
    }
    ```
    
    ### 2. Usar Partes Sequenciais de um Vídeo
    Para usar diferentes partes do mesmo vídeo:
    ```json
    {
      "clips": [
        { "start": 0, "length": 10 },   // Primeiros 10 segundos
        { "start": 10, "length": 10 },  // Segundos 10-20
        { "start": 20, "length": 10 }   // Segundos 20-30
      ]
    }
    ```
    
    ### 3. Duração Automática
    Use `"auto"` quando não souber a duração exata:
    ```json
    {
      "clip": {
        "start": 0,
        "length": "auto"  // Usa toda a duração disponível
      }
    }
    ```
    
    ## Áudio de Fundo (Background Audio)
    
    A API suporta tratamento especial para áudios de fundo, que são processados com volume reduzido
    e podem ser automaticamente repetidos para cobrir a duração total do vídeo.
    
    Existem duas formas de indicar que um áudio é de fundo:
    
    1. **Explicitamente**: Usando a propriedade `isBackground: true` no asset de áudio
    2. **Implicitamente**: Incluindo palavras-chave como 'background', 'bg', 'fundo' ou 'ambient' no nome do arquivo
    
    Exemplo de uso explícito:
    ```json
    {
      "asset": {
        "type": "audio",
        "source": "url",
        "src": "https://example.com/music.mp3",
        "isBackground": true,
        "volume": 0.3  // Opcional: ajuste fino do volume (0.0 a 1.0)
      }
    }
    ```
    
    Características do áudio de fundo:
    - Volume reduzido automaticamente (30% por padrão)
    - Loop automático se menor que a duração do vídeo
    - Transições suaves entre loops
    - Mixagem balanceada com áudios principais

paths:
  /api/render:
    post:
      summary: Inicia um job de renderização
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
            examples:
              repeat_video:
                summary: Repetir o mesmo vídeo 3 vezes
                description: Exemplo de como repetir o mesmo vídeo múltiplas vezes
                value:
                  timeline:
                    tracks:
                      - clips:
                          - asset:
                              type: video
                              source: url
                              src: "https://drive.google.com/uc?id=1UciduHpndWbuh834ZFgVIiWgo6YVAeWU&export=download"
                            start: 0
                            length: "auto"
                          - asset:
                              type: video
                              source: url
                              src: "https://drive.google.com/uc?id=1UciduHpndWbuh834ZFgVIiWgo6YVAeWU&export=download"
                            start: 0
                            length: "auto"
                          - asset:
                              type: video
                              source: url
                              src: "https://drive.google.com/uc?id=1UciduHpndWbuh834ZFgVIiWgo6YVAeWU&export=download"
                            start: 0
                            length: "auto"
                  output:
                    format: mp4
                    resolution: "1280x720"
                    quality: medium
                    fps: 30
              sequential_parts:
                summary: Usar partes sequenciais de um vídeo
                description: Exemplo de como usar diferentes partes do mesmo vídeo
                value:
                  timeline:
                    tracks:
                      - clips:
                          - asset:
                              type: video
                              source: url
                              src: "https://example.com/video.mp4"
                            start: 0
                            length: 10
                          - asset:
                              type: video
                              source: url
                              src: "https://example.com/video.mp4"
                            start: 10
                            length: 10
                          - asset:
                              type: video
                              source: url
                              src: "https://example.com/video.mp4"
                            start: 20
                            length: 10
                  output:
                    format: mp4
                    resolution: "1280x720"
                    quality: medium
                    fps: 30
      responses:
        '200':
          description: Job criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
  
  /api/media/info:
    get:
      summary: Obtém informações de um arquivo de mídia
      description: |
        Retorna informações detalhadas sobre um arquivo de mídia, incluindo duração,
        resolução, fps e formato. Útil para saber a duração antes de criar clips.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: URL do arquivo de mídia
      responses:
        '200':
          description: Informações da mídia obtidas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInfo'
        '400':
          description: URL inválida ou arquivo não encontrado
        '500':
          description: Erro interno do servidor

components:
  schemas:
    Asset:
      type: object
      required:
        - type
        - source
        - src
      properties:
        type:
          type: string
          enum: [video, audio, image, text, subtitle]
        source:
          type: string
          enum: [url, local]
        src:
          type: string
          description: URL ou caminho local do arquivo
        isBackground:
          type: boolean
          description: |
            (Apenas para áudio) Indica se este é um áudio de fundo.
            Áudios de fundo têm volume reduzido e podem fazer loop automaticamente.
        volume:
          type: number
          minimum: 0
          maximum: 1
          description: |
            (Apenas para áudio) Volume específico para este áudio.
            - Para áudios principais: padrão é 0.8
            - Para áudios de fundo: padrão é 0.3
        style:
          $ref: '#/components/schemas/Style'

    Style:
      type: object
      properties:
        fontSize:
          type: number
        fontColor:
          type: string
        outlineColor:
          type: string
        bold:
          type: boolean
        alignment:
          type: string
          enum: [left, center, right]
        position:
          type: string
          enum: [top, bottom]
        marginV:
          type: number
        outline:
          type: number
        shadow:
          type: number

    Clip:
      type: object
      required:
        - asset
        - start
        - length
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        start:
          type: number
          description: Tempo de início em segundos
        length:
          oneOf:
            - type: number
              description: Duração em segundos
            - type: string
              enum: ["auto"]
              description: Usa toda a duração disponível do vídeo

    Track:
      type: object
      required:
        - clips
      properties:
        clips:
          type: array
          items:
            $ref: '#/components/schemas/Clip'

    Timeline:
      type: object
      required:
        - tracks
      properties:
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'

    RenderOutput:
      type: object
      required:
        - format
      properties:
        format:
          type: string
          enum: [mp4, mov, gif, hls]
        resolution:
          type: string
          example: "1280x720"
        quality:
          type: string
          enum: [low, medium, high]
        fps:
          type: number
        bitrate:
          type: string
          example: "2000k"

    RenderRequest:
      type: object
      required:
        - timeline
        - output
      properties:
        timeline:
          $ref: '#/components/schemas/Timeline'
        output:
          $ref: '#/components/schemas/RenderOutput'
        webhook:
          type: string
          format: uri
          description: URL para notificação quando o processamento for concluído

    JobResponse:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: number
        output:
          type: string
        error:
          type: string
    
    MediaInfo:
      type: object
      properties:
        duration:
          type: number
          description: Duração em segundos
        width:
          type: number
          description: Largura em pixels
        height:
          type: number
          description: Altura em pixels
        fps:
          type: number
          description: Frames por segundo
        format:
          type: string
          description: Formato do arquivo (mp4, mov, etc.)
        bitrate:
          type: number
          description: Bitrate em bits por segundo
        size:
          type: number
          description: Tamanho do arquivo em bytes
        hasAudio:
          type: boolean
          description: Se o arquivo contém áudio
        hasVideo:
          type: boolean
          description: Se o arquivo contém vídeo 